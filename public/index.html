<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ad Studio</title>
<style>
  :root{--bg:#f6f4f0;--panel:#fff;--ink:#23222a;--muted:#6f6c78;--line:#e4e0d8;--accent:#2451c8;--danger:#c0362c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:18px;margin:0}header .sub{color:var(--muted);font-size:13px}
  main{max-width:1500px;margin:0 auto;padding:22px 28px 60px}
  .drop{border:2px dashed #c9c3b8;border-radius:14px;padding:22px;text-align:center;background:var(--panel);color:var(--muted);cursor:pointer;transition:.15s}
  .drop.on{border-color:var(--accent);background:#eef2ff;color:var(--accent)}
  .drop b{color:var(--ink)}
  .sides{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:22px;margin-top:22px;align-items:start}
  @media (max-width:900px){.sides{grid-template-columns:minmax(0,1fr)}}
  .side{background:#efece6;border:1px solid var(--line);border-radius:14px;padding:14px}
  .side-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .side-h h2{font-size:14px;margin:0;text-transform:uppercase;letter-spacing:.06em}
  .count{color:var(--muted);font-size:12.5px}
  .side-h .tools{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .card.sel{outline:3px solid var(--danger);outline-offset:-1px}
  .card img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#eee}
  .card .pick{position:absolute;top:8px;left:8px;width:20px;height:20px;accent-color:var(--danger);cursor:pointer}
  .card .m{padding:10px 12px;font-size:12.5px}
  .card .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .p{color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
  .card .r{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .chip{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:#eee;color:var(--muted)}
  .chip.generated{background:#e8f1ff;color:#2451c8}.chip.edited{background:#eaf7ee;color:#157a3a}.chip.upload{background:#fff3e0;color:#9a5b00}
  code.id{font-size:12px;background:#f1efe9;padding:2px 6px;border-radius:6px;cursor:pointer}
  .card .a{display:flex;gap:8px;margin-top:8px}
  .card .a a,.card .a button{flex:1;text-align:center;font-size:12.5px;font-weight:600;border-radius:8px;padding:5px 0;cursor:pointer;text-decoration:none}
  .card .a a{color:var(--accent);border:1px solid #cfdaf5;background:#f4f7ff}
  .card .a button{color:var(--danger);border:1px solid #f0c9c5;background:#fff6f5}
  .empty{color:var(--muted);font-size:13.5px;padding:8px 2px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<header><div><h1>Ad Studio</h1><div class="sub">Upload photos on the left so Claude can edit them · everything Claude makes shows up on the right</div></div></header>
<main>
  <div class="drop" id="drop"><b>Drop photos here</b> or click to choose — PNG, JPEG or WebP. Each one gets an <b>id</b> you (or Claude) can refer to.<input type="file" id="file" accept="image/png,image/jpeg,image/webp" multiple style="display:none"></div>
  <div class="sides">
    <section class="side" data-side="uploads">
      <div class="side-h"><h2>Uploaded</h2><span class="count" id="count-uploads"></span>
        <div class="tools"><button class="btn" onclick="selectAll('uploads')">Select all</button><button class="btn danger" id="del-uploads" onclick="delSelected('uploads')" disabled>Delete selected</button></div></div>
      <div class="grid" id="grid-uploads"></div>
    </section>
    <section class="side" data-side="made">
      <div class="side-h"><h2>Generated</h2><span class="count" id="count-made"></span>
        <div class="tools"><button class="btn" onclick="selectAll('made')">Select all</button><button class="btn danger" id="del-made" onclick="delSelected('made')" disabled>Delete selected</button></div></div>
      <div class="grid" id="grid-made"></div>
    </section>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
const KEY=new URLSearchParams(location.search).get("key")||"";
const $=(i)=>document.getElementById(i);
const picked={uploads:new Set(),made:new Set()};
const shown={uploads:[],made:[]};
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2200);}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function card(i,side){
  const on=picked[side].has(i.id);
  return `<div class="card${on?" sel":""}" id="c-${i.id}">
    <input type="checkbox" class="pick" title="Select" ${on?"checked":""} onchange="pick('${side}','${i.id}',this.checked)">
    <a href="/img/${i.id}" target="_blank"><img src="/thumb/${i.id}" alt="" loading="lazy"></a>
    <div class="m"><div class="t" title="${esc(i.title||"")}">${esc(i.title||i.prompt||i.kind)}</div><div class="p">${esc(i.prompt||"")}</div>
    <div class="r"><span class="chip ${i.kind}">${i.model==="enhance"?"enhanced":i.model==="format"?"format":i.kind}</span><code class="id" title="Click to copy the id" onclick="navigator.clipboard.writeText('${i.id}');toast('Copied ${i.id}')">${i.id}</code><span style="color:var(--muted)">${i.width||"?"}×${i.height||"?"}</span></div>
    <div class="a"><a href="/img/${i.id}" download>Download</a><button onclick="delOne('${side}','${i.id}')">Delete</button></div></div></div>`;
}
async function loadSide(side){
  const r=await fetch(`/api/images?side=${side}&limit=200&key=${encodeURIComponent(KEY)}`); const d=await r.json();
  const imgs=d.images||[]; shown[side]=imgs.map(i=>i.id);
  for(const id of [...picked[side]]) if(!shown[side].includes(id)) picked[side].delete(id);
  $("grid-"+side).innerHTML=imgs.map(i=>card(i,side)).join("")||`<div class="empty">${side==="uploads"?"No uploads yet.":"Nothing generated yet."}</div>`;
  $("count-"+side).textContent=imgs.length?`${imgs.length} image${imgs.length===1?"":"s"}`:"";
  syncBtn(side);
}
function load(){ loadSide("uploads"); loadSide("made"); }
function syncBtn(side){const n=picked[side].size;const b=$("del-"+side);b.disabled=!n;b.textContent=n?`Delete selected (${n})`:"Delete selected";}
function pick(side,id,on){ on?picked[side].add(id):picked[side].delete(id); const c=$("c-"+id); if(c)c.classList.toggle("sel",on); syncBtn(side); }
function selectAll(side){ const all=shown[side].length&&shown[side].every(id=>picked[side].has(id)); shown[side].forEach(id=>all?picked[side].delete(id):picked[side].add(id)); loadSide(side); }
async function removeIds(ids){
  const r=await fetch("/api/images/delete?key="+encodeURIComponent(KEY),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ids})});
  const d=await r.json().catch(()=>({})); if(!r.ok){toast(d.error||"Delete failed");return 0;} return d.deleted||0;
}
async function delOne(side,id){ if(!confirm("Delete this image? Its link will stop working."))return; const n=await removeIds([id]); picked[side].delete(id); if(n)toast("Deleted "+id); loadSide(side); }
async function delSelected(side){
  const ids=[...picked[side]]; if(!ids.length)return;
  if(!confirm(`Delete ${ids.length} image${ids.length===1?"":"s"}? Their links will stop working.`))return;
  const n=await removeIds(ids); picked[side].clear(); toast(`Deleted ${n} image${n===1?"":"s"}`); loadSide(side);
}
async function upload(files){
  for(const f of files){
    toast("Uploading "+f.name+"…");
    const r=await fetch("/api/upload?key="+encodeURIComponent(KEY)+"&title="+encodeURIComponent(f.name),{method:"POST",headers:{"Content-Type":f.type},body:f});
    const d=await r.json(); if(d.error){toast(d.error);continue;} toast("Uploaded — id "+d.id);
  }
  loadSide("uploads");
}
const drop=$("drop"); drop.onclick=()=>$("file").click(); $("file").onchange=(e)=>upload(e.target.files);
drop.ondragover=(e)=>{e.preventDefault();drop.classList.add("on");}; drop.ondragleave=()=>drop.classList.remove("on");
drop.ondrop=(e)=>{e.preventDefault();drop.classList.remove("on");upload(e.dataTransfer.files);};
load(); setInterval(load,15000);
</script>
</body>
</html>
