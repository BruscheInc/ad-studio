<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ad Studio</title>
<style>
  :root{--bg:#f6f4f0;--panel:#fff;--ink:#23222a;--muted:#6f6c78;--line:#e4e0d8;--soft:#efece6;--accent:#2451c8;--accent-soft:#eef2ff;--danger:#c0362c;--star:#e0a100;--cell:200px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
  button,input,select{font:inherit;color:inherit}
  header{display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
  header h1{font-size:18px;margin:0}header .sub{color:var(--muted);font-size:12.5px}
  header .up{margin-left:auto}
  main{max-width:1600px;margin:0 auto;padding:16px 28px 80px}
  .btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:#cfc9bd}.btn:disabled{opacity:.45;cursor:default}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn.ghost{background:transparent;border-color:transparent}
  .btn.on{background:var(--accent-soft);border-color:#c9d5f6;color:var(--accent)}
  .drop{border:2px dashed #c9c3b8;border-radius:12px;padding:12px;text-align:center;background:var(--panel);color:var(--muted);cursor:pointer;transition:.15s;font-size:13.5px}
  .drop.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .drop b{color:var(--ink)}
  /* toolbar */
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
  .search{flex:1 1 220px;min-width:180px;border:1px solid var(--line);border-radius:8px;padding:7px 11px;background:var(--panel)}
  .bar select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel);font-size:13px}
  .bar label.sz{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
  .folders{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;user-select:none}
  .chip .n{color:var(--muted);font-size:11.5px}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}.chip.on .n{color:#cfcdd6}
  .chip.drop-ok{outline:2px dashed var(--accent);outline-offset:2px;background:var(--accent-soft);color:var(--accent)}
  .chip .ed{border:0;background:none;padding:0 0 0 2px;cursor:pointer;color:inherit;opacity:.75;font-size:12px}
  /* sides */
  .sides{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:18px;margin-top:14px;align-items:start}
  @media (max-width:980px){.sides{grid-template-columns:minmax(0,1fr)}}
  .side{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px}
  .side-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;min-height:32px}
  .side-h h2{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.06em}
  .count{color:var(--muted);font-size:12.5px}
  .side-h .tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .bulk{display:none;gap:6px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin-bottom:10px;font-size:13px}
  .bulk.show{display:flex}.bulk select{border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:var(--panel)}
  .grp h3{font-size:12.5px;margin:12px 2px 8px;color:var(--muted);font-weight:700}.grp:first-child h3{margin-top:2px}
  .grp h3 span{font-weight:500}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cell),1fr));gap:12px}
  .card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:box-shadow .15s,transform .15s}
  .card:hover{box-shadow:0 4px 14px rgba(0,0,0,.07)}
  .card.sel{outline:3px solid var(--accent);outline-offset:-1px}
  .card.dragging{opacity:.4}.card.drop-before{box-shadow:-4px 0 0 var(--accent)}
  .ph{position:relative;aspect-ratio:1/1;background:#eee;cursor:zoom-in;overflow:hidden}
  .ph img{display:block;width:100%;height:100%;object-fit:cover}
  .pick{position:absolute;top:8px;left:8px;z-index:2;width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
  .star{position:absolute;top:5px;right:6px;z-index:2;border:0;background:rgba(255,255,255,.85);border-radius:999px;width:28px;height:28px;font-size:16px;line-height:28px;cursor:pointer;color:#b9b4aa}
  .star.on{color:var(--star)}
  .dim{position:absolute;left:8px;bottom:8px;z-index:2;background:rgba(20,20,25,.62);color:#fff;font-size:11px;padding:2px 7px;border-radius:999px}
  .m{padding:8px 10px 10px;font-size:12.5px}
  .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
  .t input{width:100%;font-weight:600;border:1px solid var(--accent);border-radius:6px;padding:2px 5px}
  .r{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap;color:var(--muted)}
  .kchip{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:#eee;color:var(--muted)}
  .kchip.generated{background:#e8f1ff;color:#2451c8}.kchip.edited{background:#eaf7ee;color:#157a3a}.kchip.upload{background:#fff3e0;color:#9a5b00}.kchip.resize{background:#f3e8ff;color:#7a2bb8}
  code.id{font-size:11.5px;background:#f1efe9;padding:1px 6px;border-radius:6px;cursor:pointer;color:var(--ink)}
  .ftag{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
  .ptag{display:block;margin-top:5px;font-size:11.5px;font-weight:600;color:#157a3a;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ptag:hover{text-decoration:underline}.ptag.none{color:var(--muted);font-weight:500;cursor:pointer}
  .plist{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto;margin-top:10px}
  .pitem{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--panel);cursor:pointer;text-align:left}
  .pitem:hover{border-color:var(--accent);background:var(--accent-soft)}
  .pitem img{width:48px;height:48px;object-fit:cover;border-radius:7px;background:#eee;flex:0 0 48px}
  .pitem b{display:block;font-size:13.5px}.pitem span{font-size:12px;color:var(--muted)}
  .a{display:flex;gap:6px;margin-top:8px}
  .a > *{flex:1;text-align:center;font-size:12.5px;font-weight:600;border-radius:8px;padding:5px 0;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .a .rs{color:#7a2bb8;border-color:#e3d0f5;background:#faf5ff}
  .a .dl{color:var(--accent);border-color:#cfdaf5;background:#f4f7ff}
  .a .more{flex:0 0 34px}
  .empty{color:var(--muted);font-size:13.5px;padding:8px 2px}
  /* popover menu */
  .menu{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:5px;min-width:190px;font-size:13.5px}
  .menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:7px;cursor:pointer}
  .menu button:hover{background:var(--soft)}.menu .lbl{font-size:11px;color:var(--muted);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.05em}
  .menu .red{color:var(--danger)}.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
  /* modal */
  .shade{position:fixed;inset:0;background:rgba(18,18,24,.62);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}
  .modal{background:var(--panel);border-radius:16px;max-width:1100px;width:100%;max-height:calc(100vh - 36px);overflow:auto;display:flex;flex-direction:column}
  .modal-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .modal-h h3{margin:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .modal-h .x{margin-left:auto}
  /* viewer */
  .viewer{background:#111;color:#eee;max-width:1200px}
  .viewer .modal-h{border-color:#2a2a2a}.viewer .btn{background:#222;border-color:#333;color:#eee}
  .viewer .stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:60vh;padding:12px}
  .viewer img{max-width:100%;max-height:74vh;display:block}
  .nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.12);color:#fff;width:42px;height:42px;border-radius:999px;font-size:22px;cursor:pointer}
  .nav.l{left:10px}.nav.r{right:10px}
  /* resize */
  .rsz{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:0}
  @media (max-width:820px){.rsz{grid-template-columns:1fr}}
  .rstage{background:#1b1b20;display:flex;align-items:center;justify-content:center;padding:18px;min-height:420px;position:relative}
  .cropbox{position:relative;display:inline-block;overflow:hidden;line-height:0;touch-action:none}
  .cropbox img{max-width:min(620px,100%);max-height:62vh;display:block;user-select:none;-webkit-user-drag:none}
  .frame{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move}
  .frame::before,.frame::after{content:"";position:absolute;inset:0;pointer-events:none;border:1px solid rgba(255,255,255,.35)}
  .frame::before{left:33.33%;right:33.33%;border-top:0;border-bottom:0}.frame::after{top:33.33%;bottom:33.33%;border-left:0;border-right:0}
  .extbox{position:relative;overflow:hidden;background:#333;max-width:min(620px,100%)}
    .extbox img{position:relative;width:100%;height:100%;object-fit:contain;display:block}
  .rpanel{padding:16px;display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--line)}
  .rpanel h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .preset{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel);cursor:pointer;text-align:left}
  .preset b{display:block;font-size:13px}.preset span{font-size:11.5px;color:var(--muted)}
  .preset.on{border-color:var(--accent);background:var(--accent-soft)}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{flex:1;border:0;background:var(--panel);padding:7px;cursor:pointer;font-weight:600;font-size:13px}
  .seg button.on{background:var(--ink);color:#fff}
  .row{display:flex;gap:8px;align-items:center}
  .row input[type=number]{width:90px;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  .hint{font-size:12px;color:var(--muted)}
  .warn{font-size:12px;color:#9a5b00;background:#fff6e6;border:1px solid #f3dfb4;border-radius:8px;padding:6px 8px}
  .saved{display:flex;flex-direction:column;gap:6px}
  .saved a{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:70}
  .toast.on{opacity:1;pointer-events:auto}.toast a{color:#9fb8ff;margin-left:8px}
</style>
</head>
<body>
<header>
  <div><h1>Ad Studio</h1><div class="sub">Uploads on the left · everything Claude makes on the right · resize, file and download from here</div></div>
  <span class="count up" id="total"></span>
</header>
<main>
  <div class="drop" id="drop"><b>Drop photos here</b> or click to choose — PNG, JPEG or WebP. Each one gets an <b>id</b> you (or Claude) can use.<input type="file" id="file" accept="image/png,image/jpeg,image/webp" multiple style="display:none"></div>

  <div class="bar">
    <input class="search" id="q" placeholder="Search by name or id…" autocomplete="off">
    <select id="sort" title="Sort">
      <option value="new">Newest first</option><option value="old">Oldest first</option>
      <option value="name">Name A–Z</option><option value="custom">Custom order (drag to arrange)</option>
    </select>
    <button class="btn" id="favBtn" title="Show favorites only">★ Favorites</button>
    <button class="btn" id="grpBtn" title="Group by product">Group by product</button>
    <button class="btn" id="linkAll" title="Link every image that has no product yet, using its name">🔗 Auto-link products</button>
    <label class="sz">Size <input type="range" id="cell" min="140" max="320" step="10"></label>
  </div>
  <div class="folders" id="folders"></div>

  <div class="sides">
    <section class="side" data-side="uploads">
      <div class="side-h"><h2>Uploaded</h2><span class="count" id="count-uploads"></span>
        <div class="tools"><button class="btn" data-selall="uploads">Select all</button></div></div>
      <div class="bulk" id="bulk-uploads"></div>
      <div id="list-uploads"></div>
    </section>
    <section class="side" data-side="made">
      <div class="side-h"><h2>Generated</h2><span class="count" id="count-made"></span>
        <div class="tools"><button class="btn" data-selall="made">Select all</button></div></div>
      <div class="bulk" id="bulk-made"></div>
      <div id="list-made"></div>
    </section>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const KEY = new URLSearchParams(location.search).get("key") || "";
const $ = (i) => document.getElementById(i);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem("as:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem("as:" + k, JSON.stringify(v)); } catch {} } };
async function api(path, opt = {}) {
  const url = path + (path.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(KEY);
  const r = await fetch(url, { ...opt, headers: { ...(opt.body && typeof opt.body === "string" ? { "Content-Type": "application/json" } : {}), ...(opt.headers || {}) } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
  return d;
}
const post = (p, body) => api(p, { method: "POST", body: JSON.stringify(body) });
function toast(msg, link) {
  const t = $("toast"); t.innerHTML = esc(msg) + (link ? ` <a href="${link.href}" ${link.download ? "download" : 'target="_blank"'}>${esc(link.text)}</a>` : "");
  t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), link ? 6000 : 2400);
}

/* ---------- state ---------- */
const S = {
  images: [], folders: [], sig: "",
  q: "", sort: store.get("sort", "new"), fav: store.get("fav", false), group: store.get("group", false),
  folder: store.get("folder", "__all"), cell: store.get("cell", 200),
  picked: { uploads: new Set(), made: new Set() }, shown: { uploads: [], made: [] },
  busy: false,
};
const byId = (id) => S.images.find((i) => i.id === id);
const sideOf = (i) => (i.kind === "upload" ? "uploads" : "made");
const kindLabel = (i) => (i.model === "resize" ? "resized" : i.model === "enhance" ? "enhanced" : i.model === "format" ? "format" : i.kind);
const kindClass = (i) => (i.model === "resize" ? "resize" : i.kind);
function productOf(t) {
  let s = String(t || "").trim();
  s = s.replace(/^larkspur-baby-/i, "").replace(/[-\s]\d{4}-\d{2}-\d{2}.*$/, "").replace(/\s+[—–-]\s+.*$/, "");
  s = s.replace(/-/g, " ").trim();
  return s || "Other";
}

/* ---------- load ---------- */
async function load(force) {
  if (S.busy && !force) return;
  if (!force && (document.querySelector(".shade") || document.querySelector(".t input") || S.dragIds)) return;
  try {
    const [im, fo] = await Promise.all([api("/api/images?limit=2000"), api("/api/folders")]);
    const images = im.images || [], folders = fo.folders || [];
    const sig = JSON.stringify([folders, images.map((i) => [i.id, i.title, i.folder, i.favorite, i.sort_order, i.product_url])]);
    S.images = images; S.folders = folders;
    if (!force && sig === S.sig) return;
    S.sig = sig;
    if (S.folder !== "__all" && S.folder !== "__none" && !folders.includes(S.folder)) S.folder = "__all";
    render();
  } catch (e) { toast("Couldn't load images: " + e.message); }
}

/* ---------- filter / sort ---------- */
function visible(side) {
  const q = S.q.trim().toLowerCase();
  let list = S.images.filter((i) => sideOf(i) === side);
  if (S.folder === "__none") list = list.filter((i) => !i.folder);
  else if (S.folder !== "__all") list = list.filter((i) => i.folder === S.folder);
  if (S.fav) list = list.filter((i) => i.favorite);
  if (q) list = list.filter((i) => [i.title, i.id, i.prompt, i.folder, i.product_title].some((v) => String(v || "").toLowerCase().includes(q)));
  const ts = (i) => new Date(i.created_at).getTime();
  const cmp = {
    new: (a, b) => ts(b) - ts(a),
    old: (a, b) => ts(a) - ts(b),
    name: (a, b) => String(a.title || a.id).localeCompare(String(b.title || b.id), undefined, { numeric: true }),
    custom: (a, b) => { const A = a.sort_order, B = b.sort_order; if (A == null && B == null) return ts(b) - ts(a); if (A == null) return -1; if (B == null) return 1; return A - B; },
  }[S.sort];
  return list.sort(cmp);
}

/* ---------- render ---------- */
function render() {
  document.documentElement.style.setProperty("--cell", S.cell + "px");
  $("cell").value = S.cell; $("sort").value = S.sort; $("q").value = S.q;
  $("favBtn").classList.toggle("on", S.fav); $("grpBtn").classList.toggle("on", S.group);
  $("total").textContent = S.images.length + " images";
  renderFolders(); renderSide("uploads"); renderSide("made");
}
function renderFolders() {
  const n = (f) => S.images.filter((i) => (f === "__all" ? true : f === "__none" ? !i.folder : i.folder === f)).length;
  const chip = (f, label) => `<span class="chip${S.folder === f ? " on" : ""}" data-folder="${esc(f)}">${esc(label)} <span class="n">${n(f)}</span>${S.folder === f && !f.startsWith("__") ? `<button class="ed" data-fedit="${esc(f)}" title="Rename or delete folder">✎</button>` : ""}</span>`;
  $("folders").innerHTML = chip("__all", "All images") + chip("__none", "Unfiled") + S.folders.map((f) => chip(f, "📁 " + f)).join("") + `<button class="btn ghost" id="newFolder">+ New folder</button>`;
}
function card(i, side) {
  const on = S.picked[side].has(i.id);
  const thumb = `/thumb/${i.id}?s=${S.cell > 230 ? 640 : 480}`;
  return `<div class="card${on ? " sel" : ""}" draggable="true" data-id="${i.id}" data-side="${side}">
    <input type="checkbox" class="pick" ${on ? "checked" : ""} data-pick="${i.id}" title="Select">
    <button class="star${i.favorite ? " on" : ""}" data-star="${i.id}" title="${i.favorite ? "Remove from favorites" : "Add to favorites"}">★</button>
    <div class="ph" data-view="${i.id}"><img src="${thumb}" alt="" loading="lazy" draggable="false"><span class="dim">${i.width || "?"}×${i.height || "?"}</span></div>
    <div class="m"><div class="t" data-rename="${i.id}" title="${esc(i.title || "")} — double-click to rename">${esc(i.title || i.prompt || i.kind)}</div>
      <div class="r"><span class="kchip ${kindClass(i)}">${kindLabel(i)}</span><code class="id" data-copy="${i.id}" title="Click to copy the id">${i.id}</code>${i.folder ? `<span class="ftag">📁 ${esc(i.folder)}</span>` : ""}</div>
      ${i.product_url ? `<a class="ptag" href="${esc(i.product_url)}" target="_blank" rel="noopener" title="Open product page">🔗 ${esc(i.product_title || "Linked product")}</a>` : `<span class="ptag none" data-link="${i.id}">+ Link product</span>`}
      <div class="a"><button class="rs" data-resize="${i.id}">Resize</button><a class="dl" href="/img/${i.id}?dl=1" download>Download</a><button class="more" data-more="${i.id}" title="More">⋯</button></div>
    </div></div>`;
}
function renderSide(side) {
  const list = visible(side); S.shown[side] = list.map((i) => i.id);
  for (const id of [...S.picked[side]]) if (!byId(id)) S.picked[side].delete(id);
  const emptyMsg = S.q || S.fav || S.folder !== "__all" ? "Nothing matches these filters." : side === "uploads" ? "No uploads yet." : "Nothing generated yet.";
  let html;
  if (!list.length) html = `<div class="empty">${emptyMsg}</div>`;
  else if (S.group) {
    const groups = new Map();
    for (const i of list) { const k = i.product_title || productOf(i.title); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(i); }

    <button class="btn" data-bulklink="${side}">🔗 Link product</button><button class="btn" data-bulkfav="${side}">★ Favorite</button><button class="btn" data-bulkunfav="${side}">Unfavorite</button>

/* ---------- actions ---------- */
async function patch(ids, body, msg) {
  S.busy = true;
  try { if (ids.length === 1 && "title" in body) await api("/api/images/" + ids[0], { method: "PATCH", body: JSON.stringify(body) }); else await post("/api/images/update", { ids, ...body }); if (msg) toast(msg); }
  catch (e) { toast(e.message); }
  S.busy = false; await load(true);
}
async function moveTo(ids, folder) {
  if (folder === "__new") { folder = await newFolder(); if (!folder) return; }
  const f = folder === "__none" ? "" : folder;
  await patch(ids, { folder: f }, `Moved ${ids.length} image${ids.length === 1 ? "" : "s"} to ${f ? f : "Unfiled"}`);
}
async function newFolder() {
  const name = (prompt("Folder name (e.g. Festive Trees — IG):") || "").trim(); if (!name) return null;
  try { const d = await post("/api/folders", { name }); await load(true); return d.name; } catch (e) { toast(e.message); return null; }
}
async function del(ids) {
  if (!confirm(`Delete ${ids.length} image${ids.length === 1 ? "" : "s"}? Their links will stop working.`)) return;
  try { const d = await post("/api/images/delete", { ids }); ids.forEach((id) => { S.picked.uploads.delete(id); S.picked.made.delete(id); }); toast(`Deleted ${d.deleted} image${d.deleted === 1 ? "" : "s"}`); } catch (e) { toast(e.message); }
  await load(true);
}
function startRename(id) {
  const el = document.querySelector(`[data-rename="${id}"]`); if (!el) return;
  const i = byId(id); const inp = document.createElement("input"); inp.value = i.title || ""; el.textContent = ""; el.appendChild(inp); inp.focus(); inp.select();
  let done = false;
  const finish = async (save) => { if (done) return; done = true; const v = inp.value.trim(); if (save && v && v !== i.title) await patch([id], { title: v }, "Renamed"); else render(); };
  inp.onkeydown = (e) => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); };
  inp.onblur = () => finish(true);
}
function closeMenu() { document.querySelectorAll(".menu").forEach((m) => m.remove()); }
function openMenu(id, anchor) {
  closeMenu(); const i = byId(id); const r = anchor.getBoundingClientRect();
  const m = document.createElement("div"); m.className = "menu";
  m.innerHTML = `<button data-m="rename">Rename</button><button data-m="fav">${i.favorite ? "Remove from favorites" : "Add to favorites"}</button>
    <button data-m="link">${i.product_url ? "Change product link" : "Link product…"}</button>${i.product_url ? '<button data-m="unlink">Remove product link</button>' : ""}
    <div class="lbl">Move to</div><button data-m="mv" data-f="__none">Unfiled</button>${S.folders.map((f) => `<button data-m="mv" data-f="${esc(f)}">📁 ${esc(f)}</button>`).join("")}<button data-m="mv" data-f="__new">+ New folder…</button>
    <hr><button data-m="open">Open full size</button><button data-m="copy">Copy id</button><button data-m="url">Copy image link</button><hr><button data-m="del" class="red">Delete</button>`;
  document.body.appendChild(m);
  const left = Math.min(r.right - m.offsetWidth, innerWidth - m.offsetWidth - 8), top = r.bottom + 4 + m.offsetHeight > innerHeight ? r.top - m.offsetHeight - 4 : r.bottom + 4;
  m.style.left = Math.max(8, left) + "px"; m.style.top = Math.max(8, top) + "px";
  m.onclick = async (e) => {
    const b = e.target.closest("button"); if (!b) return; closeMenu();
    const act = b.dataset.m;
    if (act === "rename") startRename(id);
    if (act === "fav") patch([id], { favorite: !i.favorite });
    if (act === "mv") moveTo([id], b.dataset.f);
    if (act === "open") window.open("/img/" + id, "_blank");
    if (act === "copy") { navigator.clipboard.writeText(id); toast("Copied " + id); }
    if (act === "url") { navigator.clipboard.writeText(location.origin + "/img/" + id); toast("Image link copied"); }
    if (act === "link") openProduct([id]);

}
async function folderEdit(f) {
  const v = prompt(`Rename folder "${f}" — or clear the name and press OK to delete the folder (images go back to Unfiled):`, f);
  if (v === null) return;
  try {
    if (!v.trim()) { if (!confirm(`Delete folder "${f}"? The images stay in Ad Studio, unfiled.`)) return; await post("/api/folders/delete", { name: f }); S.folder = "__all"; toast("Folder deleted"); }
    else if (v.trim() !== f) { await post("/api/folders/rename", { from: f, to: v.trim() }); S.folder = v.trim(); toast("Folder renamed"); }
  } catch (e) { toast(e.message); }
  store.set("folder", S.folder); await load(true);
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target;
  if (!t.closest(".menu") && !t.closest("[data-more]")) closeMenu();

});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.pick) { const id = t.dataset.pick, side = t.closest(".card").dataset.side; t.checked ? S.picked[side].add(id) : S.picked[side].delete(id); syncPick(side, id); }
  if (t.dataset.bulkmove && t.value) { const side = t.dataset.bulkmove; const ids = [...S.picked[side]]; const v = t.value; t.value = ""; moveTo(ids, v).then(() => { S.picked[side].clear(); renderSide(side); }); }
});
document.addEventListener("dblclick", (e) => { const el = e.target.closest("[data-rename]"); if (el) startRename(el.dataset.rename); });
$("q").oninput = (e) => { S.q = e.target.value; renderSide("uploads"); renderSide("made"); };
$("sort").onchange = (e) => { S.sort = e.target.value; store.set("sort", S.sort); render(); if (S.sort === "custom") toast("Drag images to arrange them"); };
$("linkAll").onclick = async () => { const b = $("linkAll"); b.disabled = true; b.textContent = "Linking…"; try { const d = await post("/api/products/autolink", {}); toast(`Linked ${d.linked} of ${d.checked} unlinked image${d.checked === 1 ? "" : "s"}` + (d.missed.length ? ` · ${d.missed.length} didn't match a product name` : "")); } catch (e) { toast(e.message); } b.disabled = false; b.textContent = "🔗 Auto-link products"; load(true); };
$("favBtn").onclick = () => { S.fav = !S.fav; store.set("fav", S.fav); render(); };

/* drag: onto a folder chip = move; onto another card (custom order) = rearrange */
document.addEventListener("dragstart", (e) => {
  const c = e.target.closest && e.target.closest(".card"); if (!c) return;
  const side = c.dataset.side, id = c.dataset.id;
  S.dragIds = S.picked[side].has(id) ? [...S.picked[side]] : [id]; S.dragSide = side;
  e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", S.dragIds.join(","));
  requestAnimationFrame(() => S.dragIds.forEach((i) => document.querySelector(`.card[data-id="${i}"]`)?.classList.add("dragging")));
});
document.addEventListener("dragend", () => { document.querySelectorAll(".dragging,.drop-before,.drop-ok").forEach((x) => x.classList.remove("dragging", "drop-before", "drop-ok")); S.dragIds = null; });
document.addEventListener("dragover", (e) => {
  if (!S.dragIds) return;
  const chip = e.target.closest(".chip"), c = e.target.closest(".card");
  document.querySelectorAll(".drop-before,.drop-ok").forEach((x) => x.classList.remove("drop-before", "drop-ok"));

document.addEventListener("drop", async (e) => {
  if (!S.dragIds) return; e.preventDefault();
  const ids = S.dragIds, side = S.dragSide; S.dragIds = null;
  const chip = e.target.closest(".chip"), c = e.target.closest(".card");
  if (chip) { await moveTo(ids, chip.dataset.folder); return; }
  if (c && c.dataset.side === side) {
    if (S.sort !== "custom") { S.sort = "custom"; store.set("sort", "custom"); }
    const order = visible(side).map((i) => i.id).filter((id) => !ids.includes(id));
    order.splice(order.indexOf(c.dataset.id), 0, ...ids);
    S.images.forEach((i) => { const k = order.indexOf(i.id); if (k >= 0) i.sort_order = k + 1; });

/* uploads */
async function upload(files) {
  for (const f of files) {
    toast("Uploading " + f.name + "…");
    try {
      const r = await fetch("/api/upload?key=" + encodeURIComponent(KEY) + "&title=" + encodeURIComponent(f.name), { method: "POST", headers: { "Content-Type": f.type }, body: f });
      const d = await r.json(); if (d.error) { toast(d.error); continue; }
      if (S.folder !== "__all" && S.folder !== "__none") await post("/api/images/update", { ids: [d.id], folder: S.folder });
      toast("Uploaded — id " + d.id);
    } catch (e) { toast("Upload failed: " + e.message); }
  }
  load(true);
}
const drop = $("drop"); drop.onclick = () => $("file").click(); $("file").onchange = (e) => upload(e.target.files);
drop.ondragover = (e) => { if (S.dragIds) return; e.preventDefault(); drop.classList.add("on"); };

/* viewer */

  const m = modal(`<div class="modal-h"><h3>${esc(i.title || i.id)}</h3><span class="count" style="color:#aaa">Actual file · ${i.width}×${i.height} · ${i.id}</span>

  m.querySelector("#vN2").onclick = async () => { const v = prompt("Rename image (this is also the download file name):", i.title || ""); if (v && v.trim() && v.trim() !== i.title) { await patch([id], { title: v.trim() }, "Renamed"); openViewer(id); } };

/* product link */

  const first = byId(ids[0]);
  const guess = first.product_title || productOf(first.title);
  const m = modal(`<div class="modal-h"><h3>Link ${ids.length === 1 ? "image" : ids.length + " images"} to a product</h3><button class="btn x" id="pX">✕</button></div>
    <div style="padding:16px">
      <input class="search" id="pQ" style="width:100%" placeholder="Search Larkspur products, or paste a product link…" value="${esc(guess === "Other" ? "" : guess)}">
      <div class="hint" style="margin-top:6px">The image will show a link to this product, and resized copies keep it.</div>

      list.innerHTML = products.length ? products.map((p, k) => `<button class="pitem" data-k="${k}">${p.image ? `<img src="${esc(p.image)}" alt="">` : "<img alt=''>"}<div><b>${esc(p.title)}</b><span>${p.price ? "$" + esc(p.price) + " · " : ""}${esc(p.url.replace(/^https?:\/\//, ""))}</span></div></button>`).join("") : '<div class="hint">No products found. Try fewer words, or paste the product link.</div>';
    } catch (e) { list.innerHTML = `<div class="warn">${esc(e.message)}</div>`; }

  m.querySelector("#pList").onclick = async (e) => {

  m.querySelectorAll("[data-mode]").forEach((b) => b.classList.toggle("on", b.dataset.mode === R.mode));
  m.querySelectorAll("[data-q]").forEach((b) => b.classList.toggle("on", (b.dataset.q === "full") === !!R.full));
  m.querySelector("#rCustom").style.display = R.preset === "custom" ? "flex" : "none";
  m.querySelector("#rW").value = R.W; m.querySelector("#rH").value = R.H;
  m.querySelector("#rZoomRow").style.display = R.mode === "crop" ? "" : "none";
  m.querySelector("#rZoom").value = R.zoom;
  m.querySelector("#rHint").textContent = R.mode === "crop" ? "Drag the frame to choose what to keep. Use zoom to go tighter." : "Nothing is cut off — extra space is filled with a soft blur of the photo's own edges.";
  const st = m.querySelector("#rStage");
  if (R.mode === "crop") {
    st.innerHTML = `<div class="cropbox" id="rBox"><img id="rImg" src="/thumb/${R.id}?s=1200" alt="" draggable="false"><div class="frame" id="rFrame"></div></div>`;
    const img = st.querySelector("#rImg"); img.complete ? layoutCrop() : (img.onload = layoutCrop);
    const fr = st.querySelector("#rFrame");
    fr.onpointerdown = (e) => {
      e.preventDefault(); fr.setPointerCapture(e.pointerId);
      const sx = e.clientX, sy = e.clientY, cx0 = R.cx, cy0 = R.cy, dw = img.clientWidth, dh = img.clientHeight;
      fr.onpointermove = (ev) => { R.cx = cx0 + (ev.clientX - sx) / dw; R.cy = cy0 + (ev.clientY - sy) / dh; layoutCrop(); };
      fr.onpointerup = () => { fr.onpointermove = null; };
    };
    st.onwheel = (e) => { e.preventDefault(); R.zoom = Math.max(1, Math.min(3, R.zoom - e.deltaY * 0.0015)); m.querySelector("#rZoom").value = R.zoom; layoutCrop(); };
  } else {
    st.onwheel = null;
    const maxW = Math.min(560, st.clientWidth - 36 || 560), maxH = Math.min(innerHeight * 0.6, 560);
    let w = maxW, h = w * R.H / R.W; if (h > maxH) { h = maxH; w = h * R.W / R.H; }
    st.innerHTML = `<div class="extbox" style="width:${w}px;height:${h}px"><div class="hint" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#bbb">Building preview…</div><img id="rExt" alt="" style="opacity:0;transition:opacity .2s"></div>`;
    const body = R.preset === "custom" ? { preset: "custom", width: R.W, height: R.H, mode: "extend" } : { preset: R.preset, mode: "extend" };
    const tok = (R.pv = (R.pv || 0) + 1);
    fetch(`/api/images/${R.id}/resize?preview=1&key=${encodeURIComponent(KEY)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then((r) => (r.ok ? r.blob() : Promise.reject())).then((b) => { if (tok !== R.pv) return; const im = document.querySelector("#rExt"); if (!im) return; im.src = URL.createObjectURL(b); im.onload = () => (im.style.opacity = 1); })
      .catch(() => {});
  }
  qualityNote();
}
function frameRect() {
  const img = document.querySelector("#rImg"); if (!img) return null;
  const dw = img.clientWidth, dh = img.clientHeight, a = R.W / R.H;
  if (!dw || !dh) return null;                      // photo not laid out yet
  if (!Number.isFinite(R.cx)) R.cx = 0.5; if (!Number.isFinite(R.cy)) R.cy = 0.5;
  let fw, fh; if (dw / dh > a) { fh = dh; fw = dh * a; } else { fw = dw; fh = dw / a; }
  fw /= R.zoom; fh /= R.zoom;
  const hx = fw / 2 / dw, hy = fh / 2 / dh;
  R.cx = Math.max(hx, Math.min(1 - hx, R.cx)); R.cy = Math.max(hy, Math.min(1 - hy, R.cy));
  return { dw, dh, fw, fh, left: R.cx * dw - fw / 2, top: R.cy * dh - fh / 2 };
}
function layoutCrop() {
  const f = frameRect(); const fr = document.querySelector("#rFrame"); if (!f || !fr) return;
  Object.assign(fr.style, { left: f.left + "px", top: f.top + "px", width: f.fw + "px", height: f.fh + "px" });
  qualityNote();
}
function outSize() {
  if (!R.full || !R.i.width) return [R.W, R.H];
  const cap = (w, h) => { const k = Math.min(1, 4096 / Math.max(w, h)); return [Math.round(w * k / 2) * 2, Math.round(h * k / 2) * 2]; };
  if (R.mode === "crop") { const f = frameRect(); if (!f) return [R.W, R.H]; return cap((f.fw / f.dw) * R.i.width, (f.fh / f.dh) * R.i.height); }
  const a = R.W / R.H; return R.i.width / R.i.height > a ? cap(R.i.width, R.i.width / a) : cap(R.i.height * a, R.i.height);
}
function qualityNote() {
  const w = document.querySelector("#rWarn"), q = document.querySelector("#rQHint"); if (!w || !R || !R.i.width) return;
  const [ow, oh] = outSize();
  if (q) q.textContent = R.full ? `Saves at ${ow}×${oh} — every pixel the photo has, same shape. Sharpest file; fine to upload anywhere.` : `Saves at the standard ${R.W}×${R.H}.`;
  let scale;
  if (R.mode === "crop") { const f = frameRect(); if (!f) return; scale = ow / ((f.fw / f.dw) * R.i.width); }
  else scale = Math.min(ow / R.i.width, oh / R.i.height);
  w.innerHTML = scale > 1.12 ? `<div class="warn">This will be enlarged about ${Math.round((scale - 1) * 100)}% to fit, so it may look a little soft. ${R.mode === "crop" ? "Zooming out helps." : ""}</div>` : "";
}
async function saveResize() {
  const btn = document.querySelector("#rSave"); btn.disabled = true; btn.textContent = "Saving…";
  const body = { mode: R.mode, full: !!R.full };
  if (R.preset === "custom") { body.preset = "custom"; body.width = R.W; body.height = R.H; } else body.preset = R.preset;
  if (R.mode === "crop") { const f = frameRect(); body.crop = { x: f.left / f.dw, y: f.top / f.dh, w: f.fw / f.dw, h: f.fh / f.dh }; }
  try {
    const d = await post(`/api/images/${R.id}/resize`, body);
    R.saved.unshift(d);
    document.querySelector("#rSaved").innerHTML = R.saved.map((s) => `<div class="hint">Saved ${s.width}×${s.height} · <code class="id">${s.id}</code> · <a href="/img/${s.id}?dl=1" download>Download</a></div>`).join("");
    toast(`Saved ${d.width}×${d.height} copy`, { href: `/img/${d.id}?dl=1`, text: "Download", download: true });
  } catch (e) { toast("Resize failed: " + e.message); }
  btn.disabled = false; btn.textContent = "Save copy";
  S.sig = ""; // refresh the grid after the modal closes
}

window.addEventListener("resize", () => { if (R && document.querySelector("#rImg")) layoutCrop(); });
load(true); setInterval(() => load(), 15000);
</script>
</body>
